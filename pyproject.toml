[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartogram-bridge"
version = "0.1.0"
description = "Cartograms between optimal transport and diffusion, with reproducible endpoint evidence."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "jax>=0.11,<0.12", "mpmath>=1.3", "threadpoolctl>=3"]

[project.optional-dependencies]
geography = ["pyshp>=2.3", "rasterio>=1.4"]
figures = ["matplotlib>=3.9", "Pillow>=10"]

[tool.setuptools]
packages = ["bcart"]
